<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasaRaf - Akıllı Alışveriş Sepetim</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffffff; display: flex; justify-content: center; color: #202124; height: 100vh; }
        .uygulama-kapsayici { width: 100%; max-width: 600px; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; height: 100vh; }
        .ust-banner-alani { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; text-align: center; }
        .logo { font-size: 26px; font-weight: bold; color: #4285F4; margin-bottom: 8px; letter-spacing: -1px; }
        .dinamik-reklam-kutusu { width: 90%; max-width: 400px; background-color: #f8f9fa; border: 1px solid #dadce0; border-radius: 20px; padding: 8px 16px; font-size: 13px; color: #5f6368; }
        #kamera-kapsayici { width: 100%; height: 240px; border: 2px solid #4285F4; border-radius: 12px; margin-bottom: 15px; display: none; position: relative; background: #000; overflow: hidden; }
        #kamera-video { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.3) brightness(1.1); }
        .okuma-hedefi { position: absolute; top: 50%; left: 5%; right: 5%; height: 50px; transform: translateY(-50%); border: 2px dashed #ff1744; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); z-index: 10; }
        .hedef-yazisi { position: absolute; top: -22px; left: 5px; color: #ff1744; font-size: 11px; font-weight: bold; background: white; padding: 1px 5px; border-radius: 4px; }
        .sepet-listesi { flex: 1; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; overflow-y: auto; background-color: #ffffff; }
        .sepet-item { display: flex; justify-content: space-between; padding: 10px; background: #f8f9fa; border-radius: 6px; margin-bottom: 8px; }
        .sepet-item-adi { font-weight: 500; color: #202124; }
        .sepet-item-fiyat { color: #1a73e8; font-weight: bold; }
        .alt-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 0 5px 0; border-top: 1px solid #dadce0; background-color: #ffffff; margin-top: 10px; }
        .toplam-alan { font-size: 20px; font-weight: bold; color: #202124; }
        .kamera-btn { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 24px; cursor: pointer; box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3); }
        .kamera-btn.kapat { background-color: #d93025; }
        .tarama-durumu { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; z-index: 11; }
    </style>
</head>
<body>

    <div class="uygulama-kapsayici">
        
        <div class="ust-banner-alani">
            <div class="logo">KasaRaf</div>
            <div id="dinamik-reklam" class="dinamik-reklam-kutusu">
                ✨ Yükleniyor...
            </div>
        </div>
        
        <div id="kamera-kapsayici">
            <video id="kamera-video" autoplay playsinline></video>
            <div class="okuma-hedefi">
                <div class="hedef-yazisi">Etiketi / Fiyatı Hizalayın</div>
            </div>
            <div id="durum-etiket" class="tarama-durumu">Yazı analiz ediliyor...</div>
        </div>

        <div class="sepet-listesi" id="sepet-listesi">
            <p id="bos-mesaj" style="color: #70757a; text-align: center; margin-top: 40px;">Sepetiniz boş. Raftaki fiyat etiketini okutmak için kamerayı başlatın.</p>
        </div>

        <div class="alt-bar">
            <div class="toplam-alan">Toplam: <span id="genel-toplam">0.00</span> TL</div>
            <button class="kamera-btn" id="btn-kamera" onclick="kameraKontrol()">📸 Kamerayı Başlat</button>
        </div>
    </div>

    <script>
        let akis = null;
        let taramaAktif = false;
        let sepet = [];

        function dinamikKonseptGuncelle() {
            const reklamKutusu = document.getElementById('dinamik-reklam');
            const gunler = [
                "🌿 Bugün Dünya Çevre Günü! Sürdürülebilir bir gelecek için bez çanta kullanalım.",
                "🛒 KasaRaf İpucu: Kasadan geçen ürün fiyatlarını ekrandan anlık eşleştirebilirsiniz.",
                "🍎 Sağlıklı Yaşam Haftası: Anlaşmalı manav reyonlarında bugün %15 indirim var!",
                "💡 Bilgilendirme: KasaRaf internetiniz çekmese dahi çevrimdışı okuma yapabilir.",
                "🎉 Hafta Sonu Konsepti: Decathlon kamp ürünlerinde KasaRaf kullanıcılarına özel fırsatlar çok yakında!"
            ];
            const secilenMesaj = gunler[Math.floor(Math.random() * gunler.length)];
            reklamKutusu.innerHTML = secilenMesaj;
        }
        window.onload = dinamikKonseptGuncelle;

        async function kameraKontrol() {
            const video = document.getElementById('kamera-video');
            const kapsayici = document.getElementById('kamera-kapsayici');
            const btn = document.getElementById('btn-kamera');

            if (!akis) {
                try {
                    akis = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" },
                        audio: false
                    });
                    
                    video.srcObject = akis;
                    kapsayici.style.display = 'block';
                    btn.innerHTML = '🛑 Kamerayı Kapat';
                    btn.classList.add('kapat');
                    
                    taramaAktif = true;
                    ocrTaramasiniBaslat(video);
                    
                } catch (hata) {
                    console.error("Kamera açılamadı:", hata);
                    alert("Kamera başlatılamadı! Lütfen tarayıcınızın kameraya erişim izni verdiğinden emin olun.");
                }
            } else {
                let trackler = akis.getTracks();
                trackler.forEach(track => track.stop());
                
                akis = null;
                taramaAktif = false;
                video.srcObject = null;
                kapsayici.style.display = 'none';
                btn.innerHTML = '📸 Kamerayı Başlat';
                btn.classList.remove('kapat');
            }
        }

        async function ocrTaramasiniBaslat(video) {
            const durum = document.getElementById('durum-etiket');
            let sonTarihZamani = 0;

            const tarama = async () => {
                if (!taramaAktif) return;

                const suAnki = Date.now();
                // Her 2 saniyede bir tarama yap (performans için)
                if (suAnki - sonTarihZamani < 2000) {
                    requestAnimationFrame(tarama);
                    return;
                }
                sonTarihZamani = suAnki;

                durum.textContent = '🔄 Analiz ediliyor...';
                
                try {
                    const { data: { text } } = await Tesseract.recognize(video, 'tur');
                    
                    if (text.trim()) {
                        durum.textContent = '✓ Metin bulundu!';
                        metniIsle(text);
                    } else {
                        durum.textContent = '⏳ Metin bulunamadı...';
                    }
                } catch (hata) {
                    console.error("OCR hatası:", hata);
                    durum.textContent = '❌ Hata!';
                }

                requestAnimationFrame(tarama);
            };

            tarama();
        }

        function metniIsle(text) {
            // Basit fiyat ve ürün adı ayrıştırma
            // Örnek: "ELMA 12,50 TL" → ürün: "ELMA", fiyat: "12,50"
            
            const fiyatRegex = /[\d,\.]+\s*(?:TL|₺)/gi;
            const eslestir = text.match(fiyatRegex);
            
            if (eslestir) {
                const fiyat = eslestir[0].replace(/[^\d,\.]/g, '').replace(',', '.');
                const urunAdi = text.replace(fiyatRegex, '').trim() || 'Bilinmeyen Ürün';
                
                sepeteEkle(urunAdi, parseFloat(fiyat));
            }
        }

        function sepeteEkle(urunAdi, fiyat) {
            // Aynı ürün zaten varsa miktarını artır
            const varOlan = sepet.find(u => u.adi === urunAdi);
            
            if (varOlan) {
                varOlan.miktar++;
            } else {
                sepet.push({ adi: urunAdi, fiyat, miktar: 1 });
            }

            sepetGuncelle();
        }

        function sepetGuncelle() {
            const listesi = document.getElementById('sepet-listesi');
            const bosMesaj = document.getElementById('bos-mesaj');
            const toplam = document.getElementById('genel-toplam');

            if (sepet.length === 0) {
                listesi.innerHTML = '<p id="bos-mesaj" style="color: #70757a; text-align: center; margin-top: 40px;">Sepetiniz boş. Raftaki fiyat etiketini okutmak için kamerayı başlatın.</p>';
                toplam.textContent = '0.00';
                return;
            }

            listesi.innerHTML = sepet.map((item, idx) => `
                <div class="sepet-item">
                    <div>
                        <div class="sepet-item-adi">${item.adi}</div>
                        <div style="font-size: 12px; color: #5f6368;">Miktar: ${item.miktar}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="sepet-item-fiyat">${(item.fiyat * item.miktar).toFixed(2)} TL</div>
                        <button onclick="sepettenCikar(${idx})" style="background: none; border: none; color: #d93025; cursor: pointer; font-size: 12px;">Sil</button>
                    </div>
                </div>
            `).join('');

            const toplamTutar = sepet.reduce((sum, item) => sum + (item.fiyat * item.miktar), 0);
            toplam.textContent = toplamTutar.toFixed(2);
        }

        function sepettenCikar(index) {
            sepet.splice(index, 1);
            sepetGuncelle();
        }
    </script>
</body>
</html>
