<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasaRaf - Akıllı Alışveriş Sepetim</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex; justify-content: center;
            color: #202124; height: 100vh;
        }

        .uygulama-kapsayici {
            width: 100%; max-width: 600px;
            display: flex; flex-direction: column;
            padding: 15px; box-sizing: border-box;
            height: 100vh; background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .ust-banner-alani { text-align: center; margin-bottom: 10px; }
        .logo { font-size: 26px; font-weight: bold; color: #1a73e8; margin-bottom: 5px; }
        
        .bilgi-kutusu {
            background-color: #e8f0fe; color: #1a73e8;
            padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 500;
        }

        #kamera-kapsayici {
            width: 100%; height: 240px;
            border: 2px solid #1a73e8; border-radius: 8px;
            margin-bottom: 15px; display: none;
            position: relative; background: #000; overflow: hidden;
        }

        #kamera-video { width: 100%; height: 100%; object-fit: cover; }

        .okuma-hedefi {
            position: absolute; top: 25%; left: 5%; right: 5%; height: 50%;
            border: 2px dashed #ff1744;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
            pointer-events: none; border-radius: 4px;
        }

        .tarama-durumu {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%); background: rgba(0,0,0,0.85);
            color: #ffeb3b; padding: 6px 16px; border-radius: 20px;
            font-size: 12px; z-index: 10; display: none; font-weight: bold;
        }

        /* ÇEK BUTONU */
        .cek-btn {
            position: absolute; bottom: 45px; left: 50%;
            transform: translateX(-50%); background-color: #ff1744;
            color: white; border: none; padding: 10px 20px;
            font-size: 14px; font-weight: bold; border-radius: 20px;
            cursor: pointer; z-index: 20; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: none;
        }

        /* TABLO TASARIMI */
        .sepet-kapsayici {
            flex: 1; overflow-y: auto;
            border: 1px solid #dadce0; border-radius: 8px;
            background-color: #ffffff;
        }

        .kasa-tablosu { width: 100%; border-collapse: collapse; text-align: left; }
        .kasa-tablosu thead th {
            background-color: #f8f9fa; color: #5f6368;
            font-size: 12px; padding: 10px 8px;
            border-bottom: 2px solid #dadce0; position: sticky; top: 0;
        }
        .kasa-tablosu tbody td {
            padding: 10px 8px; border-bottom: 1px solid #eee;
            vertical-align: middle; font-size: 14px; color: #202124;
        }

        .td-urun { font-weight: bold; width: 30%; }
        .td-fiyat { color: #5f6368; width: 15%; font-size: 13px; }
        .td-adet { width: 25%; white-space: nowrap; }
        .td-toplam { font-weight: bold; color: #1a73e8; width: 20%; }
        .td-sil { width: 10%; text-align: center; }

        .adet-kutusu {
            display: inline-flex; align-items: center;
            border: 1px solid #dadce0; border-radius: 4px; overflow: hidden;
        }
        .adet-btn {
            background: #f1f3f4; border: none; width: 26px; height: 26px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .adet-input {
            width: 35px; height: 24px; text-align: center; border: none;
            border-left: 1px solid #dadce0; border-right: 1px solid #dadce0;
            font-size: 13px; font-weight: bold; outline: none;
        }
        .adet-input::-webkit-inner-spin-button, 
        .adet-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .sil-btn {
            background: #fce8e6; color: #d93025; border: none;
            width: 28px; height: 28px; border-radius: 4px;
            cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }

        .bos-sepet { text-align: center; padding: 40px 20px; color: #70757a; font-size: 14px; }

        .alt-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0 5px 0; border-top: 2px solid #dadce0;
            background-color: #ffffff; margin-top: 10px;
        }
        .toplam-tutar { font-size: 22px; font-weight: bold; color: #d93025; }
        
        .kamera-btn {
            background-color: #1a73e8; color: white; border: none;
            padding: 12px 20px; font-size: 15px; font-weight: bold;
            border-radius: 8px; cursor: pointer;
        }
        .kamera-btn.kapat { background-color: #5f6368; }
    </style>
</head>
<body>

    <div class="uygulama-kapsayici">
        
        <div class="ust-banner-alani">
            <div class="logo">KasaRaf</div>
            <div class="bilgi-kutusu" id="bilgi-kutusu">Yapay Zeka Hazırlanıyor...</div>
        </div>
        
        <div id="kamera-kapsayici">
            <video id="kamera-video" autoplay playsinline></video>
            <div class="okuma-hedefi"></div>
            <div id="durum-etiket" class="tarama-durumu">Etiketi kutuya ortalayın</div>
            <button class="cek-btn" id="btn-cek" onclick="etiketiOkuVeEkle()">🔍 Bu Etiketi Oku</button>
        </div>

        <div class="sepet-kapsayici">
            <table class="kasa-tablosu" id="kasa-tablosu" style="display: none;">
                <thead>
                    <tr>
                        <th>Ürün</th>
                        <th>B.Fiyat</th>
                        <th>Adet</th>
                        <th>Toplam</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="sepet-govdesi"></tbody>
            </table>
            <div class="bos-sepet" id="bos-sepet-mesaji">
                Sepetiniz boş.<br>Etiketi gösterip "Bu Etiketi Oku" butonuna basın.
            </div>
        </div>

        <div class="alt-bar">
            <div class="toplam-alan">Genel Toplam<br><span class="toplam-tutar" id="genel-toplam">0.00 TL</span></div>
            <button class="kamera-btn" id="btn-kamera" onclick="kameraKontrol()">📸 Kamerayı Aç</button>
        </div>
    </div>

    <script>
        let akis = null;
        let sepet = [];
        let benzersizUrunId = 0;
        let ocrMotoru = null; 

        document.addEventListener('DOMContentLoaded', async () => {
            const bilgiKutusu = document.getElementById('bilgi-kutusu');
            try {
                ocrMotoru = await Tesseract.createWorker('tur');
                bilgiKutusu.innerText = "✅ Sistem Hazır! Kamerayı açabilirsiniz.";
                bilgiKutusu.style.backgroundColor = "#e6f4ea";
                bilgiKutusu.style.color = "#137333";
            } catch (hata) {
                bilgiKutusu.innerText = "❌ Hata: " + hata.message;
            }
        });

        async function kameraKontrol() {
            const video = document.getElementById('kamera-video');
            const kapsayici = document.getElementById('kamera-kapsayici');
            const btn = document.getElementById('btn-kamera');
            const cekBtn = document.getElementById('btn-cek');
            const durum = document.getElementById('durum-etiket');

            if (!akis) {
                try {
                    akis = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                } catch (e1) {
                    try {
                        akis = await navigator.mediaDevices.getUserMedia({ video: true });
                    } catch (e2) {
                        alert("Kameraya erişilemedi!");
                        return;
                    }
                }
                video.srcObject = akis;
                kapsayici.style.display = 'block';
                cekBtn.style.display = 'block';
                durum.style.display = 'block';
                btn.innerHTML = '🛑 Kamerayı Kapat';
                btn.classList.add('kapat');
            } else {
                akis.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                akis = null;
                kapsayici.style.display = 'none';
                cekBtn.style.display = 'none';
                durum.style.display = 'none';
                btn.innerHTML = '📸 Kamerayı Aç';
                btn.classList.remove('kapat');
            }
        }

        // BUTONA BASILDIĞINDA ANLIK FOTOĞRAF ÇEKER VE OKUR
        async function etiketiOkuVeEkle() {
            const video = document.getElementById('kamera-video');
            const durum = document.getElementById('durum-etiket');
            if (!ocrMotoru || !akis) return;

            durum.innerText = "Okunuyor, lütfen bekleyin...";

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const { data: { text } } = await ocrMotoru.recognize(canvas);
                const veri = etiketiCozumle(text);

                if (veri.fiyat > 0) {
                    sepeteEkle(veri.isim, veri.fiyat);
                    durum.innerText = `✅ Eklendi: ${veri.isim} (${veri.fiyat} ₺)`;
                } else {
                    durum.innerText = "❌ Fiyat bulunamadı, tekrar deneyin.";
                }
            } catch (hata) {
                durum.innerText = "Okuma hatası oluştu.";
            }
        }

        function etiketiCozumle(hamMetin) {
            const satirlar = hamMetin.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            let urunIsmi = "";
            let urunFiyati = 0;

            for (let satir of satirlar) {
                let temiz = satir.replace(/[^a-zA-ZçğıöşüÇĞIÖŞÜ\s]/g, '').trim();
                if (temiz.length >= 3) {
                    urunIsmi = temiz.toUpperCase();
                    break;
                }
            }
            if (!urunIsmi) urunIsmi = "MISIR";

            const tumRakamlar = hamMetin.match(/\b\d{1,3}\b/g);
            if (tumRakamlar) {
                for (let r of tumRakamlar) {
                    let sayi = parseInt(r);
                    if (sayi > 0 && sayi < 1000 && sayi !== 2024 && sayi !== 2025 && sayi !== 2026) {
                        urunFiyati = parseFloat(sayi);
                        break;
                    }
                }
            }
            return { isim: urunIsmi, fiyat: urunFiyati };
        }

        function sepeteEkle(isim, fiyat) {
            const mevcut = sepet.find(u => u.isim === isim && u.fiyat === fiyat);
            if (mevcut) {
                mevcut.adet += 1;
            } else {
                benzersizUrunId++;
                sepet.push({ id: benzersizUrunId, isim: isim, fiyat: fiyat, adet: 1 });
            }
            tabloyuCiz();
        }

        function tabloyuCiz() {
            const tbody = document.getElementById('sepet-govdesi');
            const tablo = document.getElementById('kasa-tablosu');
            const bosMesaj = document.getElementById('bos-sepet-mesaji');
            const genelToplamAlan = document.getElementById('genel-toplam');

            if (sepet.length === 0) {
                tablo.style.display = 'none';
                bosMesaj.style.display = 'block';
                genelToplamAlan.innerText = '0.00 TL';
                return;
            }

            tablo.style.display = 'table';
            bosMesaj.style.display = 'none';
            tbody.innerHTML = '';
            let genelToplam = 0;

            sepet.forEach(urun => {
                const satirToplam = urun.fiyat * urun.adet;
                genelToplam += satirToplam;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="td-urun">${urun.isim}</td>
                    <td class="td-fiyat">${urun.fiyat.toFixed(2)}</td>
                    <td class="td-adet">
                        <div class="adet-kutusu">
                            <button class="adet-btn" onclick="adetDegistir(${urun.id}, -1)">-</button>
                            <input type="number" class="adet-input" value="${urun.adet}" min="1" onchange="klavyeAdet(event, ${urun.id})">
                            <button class="adet-btn" onclick="adetDegistir(${urun.id}, 1)">+</button>
                        </div>
                    </td>
                    <td class="td-toplam">${satirToplam.toFixed(2)}</td>
                    <td class="td-sil">
                        <button class="sil-btn" onclick="satirSil(${urun.id})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            genelToplamAlan.innerText = genelToplam.toFixed(2) + ' TL';
        }

        function adetDegistir(id, miktar) {
            const urun = sepet.find(u => u.id === id);
            if (urun) {
                urun.adet += miktar;
                if (urun.adet < 1) urun.adet = 1;
                tabloyuCiz();
            }
        }

        function klavyeAdet(event, id) {
            const urun = sepet.find(u => u.id === id);
            if (urun) {
                let yeniAdet = parseInt(event.target.value);
                if (isNaN(yeniAdet) || yeniAdet < 1) yeniAdet = 1;
                urun.adet = yeniAdet;
                tabloyuCiz();
            }
        }

        function satirSil(id) {
            sepet = sepet.filter(u => u.id !== id);
            tabloyuCiz();
        }
    </script>
</body>
</html>
