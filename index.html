<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasaRaf - Akıllı Sepet</title>
    <!-- Yerel bilgisayarda sorunsuz çalışan Tesseract v4 kararlı sürümü -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            background: #1e88e5;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
        }
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 25%;
            border: 3px solid #ff3d00;
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
        .btn-danger { background: #e53935; }
        .status {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin: 10px 0;
            font-weight: 500;
        }
        .basket-box {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }
        .basket-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        .total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            color: #1e88e5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🛒 KasaRaf</h2>
        <p style="margin:5px 0 0 0;">Akıllı Kamera ile Alışveriş Sepetiniz</p>
    </div>

    <div class="camera-box">
        <video id="kamera" autoplay playsinline muted></video>
        <div class="overlay"></div>
    </div>

    <button id="btnKamera" class="btn">Kamerayı Başlat</button>
    <div id="durum" class="status">Kamerayı başlatarak fiyat etiketini okutun.</div>

    <div class="basket-box">
        <h3>Sepetiniz</h3>
        <div id="sepetListesi">
            <p style="color:#888; text-align:center;">Sepetiniz boş. Tarama yapın.</p>
        </div>
        <div class="total">
            <span>Genel Toplam:</span>
            <span id="toplamFiyat">0.00 TL</span>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('kamera');
    const btnKamera = document.getElementById('btnKamera');
    const durum = document.getElementById('durum');
    const sepetListesi = document.getElementById('sepetListesi');
    const toplamFiyat = document.getElementById('toplamFiyat');

    let akis = null;
    let ocrMotoru = null;
    let taramaAraligi = null;
    let sepet = [];

    btnKamera.addEventListener('click', async () => {
        if (akis) {
            kamerayiDurdur();
        } else {
            await kamerayiBaslat();
        }
    });

    async function kamerayiBaslat() {
        durum.innerText = 'Kamera açılıyor...';
        try {
            akis = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = akis;
            btnKamera.innerText = 'Kamerayı Kapat';
            btnKamera.classList.add('btn-danger');
            
            await ocrBaslat();
        } catch (hata) {
            console.error(hata);
            durum.innerText = 'Kameraya erişilemedi! İzinleri kontrol edin.';
        }
    }

    function kamerayiDurdur() {
        if (akis) {
            akis.getTracks().forEach(track => track.stop());
            akis = null;
        }
        video.srcObject = null;
        btnKamera.innerText = 'Kamerayı Başlat';
        btnKamera.classList.remove('btn-danger');
        durum.innerText = 'Kamera kapatıldı.';
        clearInterval(taramaAraligi);
    }

    async function ocrBaslat() {
        if (!ocrMotoru) {
            durum.innerText = 'Yapay Zeka Yükleniyor... (Lütfen Bekleyin)';
            try {
                // Bilgisayarda çakışma yaratmayan en kararlı yükleme fonksiyonu
                ocrMotoru = await Tesseract.createWorker();
                await ocrMotoru.loadLanguage('tur');
                await ocrMotoru.initialize('tur');
                durum.innerText = 'Fiyatı kırmızı alana hizalayın...';
            } catch (hata) {
                console.error(hata);
                durum.innerText = 'Yapay zeka yüklenemedi!';
                return;
            }
        }
        taramaAraligi = setInterval(görüntüYakalaVeTara, 2500);
    }

    async function görüntüYakalaVeTara() {
        if (!ocrMotoru || video.paused || video.ended) return;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        const vW = video.videoWidth;
        const vH = video.videoHeight;
        
        if (vW === 0 || vH === 0) return;

        const cropW = vW * 0.70;
        const cropH = vH * 0.25;
        const cropX = (vW - cropW) / 2;
        const cropY = (vH - cropH) / 2;

        canvas.width = cropW;
        canvas.height = cropH;

        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        try {
            const sonuc = await ocrMotoru.recognize(canvas);
            const metin = sonuc.data.text;
            console.log("Okunan Metin:", metin);
            metniAnalizEt(metin);
        } catch (hata) {
            console.error("Tarama hatası:", hata);
        }
    }

    function metniAnalizEt(metin) {
        // Satırlardaki sayıları ve fiyat formatlarını ayıklar
        const satirlar = metin.split('\n');
        let fiyat = null;
        let urunAdi = "Ürün";

        for (let satir of satirlar) {
            const rakamlar = satir.replace(',', '.').match(/(\d+\.\d{2})/);
            if (rakamlar) {
                fiyat = parseFloat(rakamlar[0]);
                break;
            }
        }

        // Eğer geçerli bir fiyat bulunursa sepete ekle
        if (fiyat && fiyat > 0) {
            // Metindeki ilk kelimeleri temizleyip isim yapmaya çalış
            const harfler = metin.replace(/[^a-zA-ZğüşıöçĞÜŞİÖÇ ]/g, '').trim();
            if (harfler.length > 2) {
                urunAdi = harfler.split(' ')[0] + " " + (harfler.split(' ')[1] || "");
            }

            sepetiGuncelle(urunAdi, fiyat);
            durum.innerText = `Eklendi: ${urunAdi} - ${fiyat} TL`;
            
            // Üst üste hızlı okumayı engellemek için duraklat
            clearInterval(taramaAraligi);
            setTimeout(() => {
                if(akis) taramaAraligi = setInterval(görüntüYakalaVeTara, 2500);
            }, 3500);
        }
    }

    function sepetiGuncelle(ad, fiyat) {
        sepet.push({ ad, fiyat });
        sepetListesi.innerHTML = '';
        let toplam = 0;
        
        sepet.forEach(item => {
            toplam += item.fiyat;
            sepetListesi.innerHTML += `
                <div class="basket-item">
                    <span>🛒 ${item.ad}</span>
                    <strong>${item.fiyat.toFixed(2)} TL</strong>
                </div>
            `;
        });
        
        toplamFiyat.innerText = `${toplam.toFixed(2)} TL`;
    }
</script>

</body>
</html>
