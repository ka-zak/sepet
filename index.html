<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Segoe UI",sans-serif;
    background:#f1f3f4;
    color:#202124;
}

.uygulama{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding:12px;
    background:white;
}

.baslik{
    text-align:center;
    margin-bottom:10px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#1a73e8;
}

.bilgi{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    background:#e8f0fe;
    color:#1a73e8;
    font-size:13px;
}

/* =========================
   KAMERA
========================= */

#kamera-kapsayici{
    display:none;
    position:relative;
    width:100%;
    height:320px;
    background:#000;
    overflow:hidden;
    border-radius:10px;
    border:2px solid #1a73e8;
    margin-bottom:12px;
}

#kamera-video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   HEDEF
========================= */

#okuma-hedefi{
    position:absolute;
    left:7%;
    top:30%;
    width:86%;
    height:40%;
    border:3px solid #ff1744;
    border-radius:8px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.45);
    pointer-events:none;
    z-index:5;
}

#hedef-yazisi{
    position:absolute;
    top:-32px;
    left:5px;
    color:white;
    background:#ff1744;
    padding:5px 8px;
    border-radius:5px;
    font-size:12px;
}

#tarama-cizgisi{
    position:absolute;
    left:5px;
    right:5px;
    height:3px;
    background:#00ff66;
    box-shadow:0 0 10px #00ff66;
    animation:tara 2s linear infinite;
}

@keyframes tara{
    0%{top:5%}
    50%{top:92%}
    100%{top:5%}
}

/* =========================
   DURUM
========================= */

#durum-etiket{
    display:none;
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.88);
    color:#ffeb3b;
    padding:8px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    z-index:20;
    white-space:nowrap;
}

/* =========================
   OKU BUTONU
========================= */

#btn-cek{
    display:none;
    position:absolute;
    bottom:48px;
    left:50%;
    transform:translateX(-50%);
    background:#ff1744;
    color:white;
    border:none;
    padding:13px 24px;
    border-radius:25px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    z-index:20;
}

#btn-cek:disabled{
    opacity:.6;
}

/* =========================
   SONUÇ KARTI
========================= */

#sonuc-karti{
    display:none;
    border:2px solid #1a73e8;
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
    background:#f8fbff;
}

#sonuc-karti h3{
    margin:0 0 12px 0;
    color:#1a73e8;
}

.sonuc-alan{
    margin-bottom:10px;
}

.sonuc-alan label{
    display:block;
    font-size:12px;
    font-weight:bold;
    color:#5f6368;
    margin-bottom:5px;
}

.sonuc-alan input{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

.sonuc-butonlari{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.sonuc-butonlari button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

#btn-onayla{
    background:#188038;
    color:white;
}

#btn-iptal{
    background:#d93025;

/* =========================
   SEPET
========================= */

.sepet-kapsayici{
    border:1px solid #dadce0;
    border-radius:10px;
    overflow-x:auto;
}

table{
    width:100%;

th{
    background:#f8f9fa;

    font-size:12px;
    color:#5f6368;
}

td{

    border-top:1px solid #eeeeee;

.td-urun{

}

.td-adet{

}

.adet-kutusu{

.toplam-baslik{

#btn-kamera{

    border-radius:8px;

/* =========================

    }

        font-size:11px;
    }

    }

<script>

/* =========================================================
   DEĞİŞKENLER
========================================================= */

let akis = null;

let ocrMotoru = null;

let okumaDevamEdiyor = false;

let sepet = [];

let benzersizUrunId = 0;

let bekleyenSonuc = null;


/* =========================================================
   OCR MOTORU
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const bilgi =
            document.getElementById("bilgi-kutusu");

        try{

            bilgi.innerText =
                "⏳ OCR sistemi yükleniyor...";

            ocrMotoru =
                await Tesseract.createWorker();

            await ocrMotoru.loadLanguage(
                "tur+eng"
            );

            await ocrMotoru.initialize(
                "tur+eng"
            );

            await ocrMotoru.setParameters({

                tessedit_pageseg_mode:"6",

                preserve_interword_spaces:"1"

            });

            bilgi.innerText =
                "✅ Sistem hazır. Kamerayı başlatabilirsiniz.";

        }

        catch(hata){

            console.error(
                "OCR YÜKLEME HATASI:",
                hata
            );

            bilgi.innerText =
                "❌ OCR yüklenemedi.";

        }

    }
);


/* =========================================================
   KAMERA AÇ / KAPAT
========================================================= */

async function kameraKontrol(){

    const video =
        document.getElementById("kamera-video");

    const kapsayici =
        document.getElementById("kamera-kapsayici");

    const kameraBtn =
        document.getElementById("btn-kamera");

    const okuBtn =
        document.getElementById("btn-cek");

    const durum =
        document.getElementById("durum-etiket");


    /* KAMERA AÇ */

    if(!akis){

        try{

            akis =
                await navigator.mediaDevices.getUserMedia({

                    video:{
                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }
                    },

                    audio:false

                });

        }

        catch(hata){

            try{

                akis =
                    await navigator.mediaDevices.getUserMedia({

                        video:true,

                        audio:false

                    });

            }

            catch(hata2){

                console.error(hata2);

                alert(
                    "❌ Kameraya erişilemedi. Tarayıcı kamera iznini kontrol edin."
                );

                return;

            }

        }


        video.srcObject = akis;

        await video.play();


        kapsayici.style.display =
            "block";

        okuBtn.style.display =
            "block";

        durum.style.display =
            "block";

        durum.innerText =
            "📷 Etiketi kırmızı çerçeveye getirin";


        kameraBtn.innerHTML =
            "🛑 Kamerayı Kapat";

        kameraBtn.classList.add("kapat");

    }

    /* KAMERA KAPAT */

    else{

        akis.getTracks().forEach(
            track => track.stop()
        );

        akis = null;

        video.srcObject = null;

        kapsayici.style.display =
            "none";

        okuBtn.style.display =
            "none";

        durum.style.display =
            "none";

        kameraBtn.innerHTML =
            "📸 Kamerayı Başlat";

        kameraBtn.classList.remove("kapat");

    }

}


/* =========================================================
   ETİKET OKU
========================================================= */

async function etiketiOku(){

    const video =
        document.getElementById("kamera-video");

    const durum =
        document.getElementById("durum-etiket");

    const btn =
        document.getElementById("btn-cek");

    const hedef =
        document.getElementById("okuma-hedefi");


    /* OCR HAZIR MI? */

    if(!ocrMotoru){

        durum.innerText =
            "⏳ OCR sistemi henüz hazır değil";

        return;

    }


    /* KAMERA */

    if(!akis){

        durum.innerText =
            "❌ Kamera açık değil";

        return;

    }


    /* İKİNCİ OKUMA ENGELİ */

    if(okumaDevamEdiyor){

        return;

    }


    if(
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ){

        durum.innerText =
            "⏳ Kamera hazırlanıyor...";

        return;

    }


    okumaDevamEdiyor = true;

    btn.disabled = true;

    btn.innerText =
        "⏳ OKUNUYOR...";


    try{

        /* ==========================================
           VİDEO ÖLÇÜLERİ
        ========================================== */

        const videoRect =
            video.getBoundingClientRect();

        const hedefRect =
            hedef.getBoundingClientRect();


        const videoOran =
            video.videoWidth /
            video.videoHeight;

        const ekranOran =
            videoRect.width /
            videoRect.height;


        let gosterilenGenislik;

        let gosterilenYukseklik;

        let offsetX = 0;

        let offsetY = 0;


        /* OBJECT-FIT COVER */

        if(videoOran > ekranOran){

            gosterilenYukseklik =
                videoRect.height;

            gosterilenGenislik =
                gosterilenYukseklik *
                videoOran;

            offsetX =
                (
                    gosterilenGenislik -
                    videoRect.width
                ) / 2;

        }

        else{

            gosterilenGenislik =
                videoRect.width;

            gosterilenYukseklik =
                gosterilenGenislik /
                videoOran;

            offsetY =
                (
                    gosterilenYukseklik -
                    videoRect.height
                ) / 2;

        }


        const scaleX =
            video.videoWidth /
            gosterilenGenislik;

        const scaleY =
            video.videoHeight /
            gosterilenYukseklik;


        let x =
            (
                hedefRect.left -
                videoRect.left +
                offsetX
            ) * scaleX;


        let y =
            (
                hedefRect.top -
                videoRect.top +
                offsetY
            ) * scaleY;


        let w =
            hedefRect.width *
            scaleX;


        let h =
            hedefRect.height *
            scaleY;


        x = Math.max(
            0,
            Math.floor(x)
        );

        y = Math.max(
            0,
            Math.floor(y)
        );

        w = Math.min(
            Math.floor(w),
            video.videoWidth - x
        );

        h = Math.min(
            Math.floor(h),
            video.videoHeight - y
        );


        if(w < 20 || h < 20){

            throw new Error(
                "Okuma alanı geçersiz."
            );

        }


        durum.innerText =
            "📸 Etiket görüntüsü alınıyor...";


        /* ==========================================
           TAM KAMERA CANVAS
        ========================================== */

        const tamCanvas =
            document.createElement("canvas");

        tamCanvas.width =
            video.videoWidth;

        tamCanvas.height =
            video.videoHeight;


        const tamCtx =
            tamCanvas.getContext(
                "2d",
                {
                    willReadFrequently:true
                }
            );


        tamCtx.drawImage(
            video,
            0,
            0,
            tamCanvas.width,
            tamCanvas.height
        );


        /* ==========================================
           OCR CANVAS
        ========================================== */

        const BUYUTME = 4;

        const ocrCanvas =
            document.createElement("canvas");

        ocrCanvas.width =
            Math.floor(w * BUYUTME);

        ocrCanvas.height =
            Math.floor(h * BUYUTME);


        const ctx =
            ocrCanvas.getContext(
                "2d",
                {
                    willReadFrequently:true
                }
            );


        ctx.imageSmoothingEnabled = true;

        ctx.imageSmoothingQuality = "high";


        ctx.drawImage(

            tamCanvas,

            x,
            y,
            w,
            h,

            0,
            0,
            ocrCanvas.width,
            ocrCanvas.height

        );


        /* ==========================================
           GÖRÜNTÜ İYİLEŞTİRME
        ========================================== */

        durum.innerText =
            "🔍 Görüntü hazırlanıyor...";


        const imageData =
            ctx.getImageData(
                0,
                0,
                ocrCanvas.width,
                ocrCanvas.height
            );


        const data =
            imageData.data;


        for(
            let i=0;
            i<data.length;
            i+=4
        ){

            const r = data[i];

            const g = data[i+1];

            const b = data[i+2];


            let gri =
                0.299*r +
                0.587*g +
                0.114*b;


            /* kontrast */

            gri =
                ((gri - 128) * 1.35) + 128;


            gri =
                Math.max(
                    0,
                    Math.min(
                        255,
                        gri
                    )
                );


            data[i] =
                gri;

            data[i+1] =
                gri;

            data[i+2] =
                gri;

        }


        ctx.putImageData(
            imageData,
            0,
            0
        );


        /* ==========================================
           OCR
        ========================================== */

        durum.innerText =
            "🔍 Ürün ve fiyat okunuyor...";


        await ocrMotoru.setParameters({

            tessedit_pageseg_mode:"6",

            preserve_interword_spaces:"1"

        });


        const sonuc =
            await ocrMotoru.recognize(
                ocrCanvas
            );


        const metin =
            sonuc.data.text || "";


        console.log(
            "========== HAM OCR =========="
        );

        console.log(metin);

        console.log(
            "=============================="
        );


        /* ==========================================
           ÇÖZÜMLE
        ========================================== */

        const veri =
            etiketiCozumle(metin);


        console.log(
            "ÇÖZÜMLENEN VERİ:",
            veri
        );


        /* ==========================================
           FİYAT YOKSA
        ========================================== */

        if(veri.fiyat <= 0){

            durum.innerText =
                "❌ Fiyat bulunamadı. Etiketi biraz yaklaştırın.";

            return;

        }


        /* ==========================================
           SONUCU BEKLET
        ========================================== */

        bekleyenSonuc = {

            isim:
                veri.isim,

            fiyat:
                veri.fiyat,

            hamMetin:
                metin

        };


        document.getElementById(
            "sonuc-urun"
        ).value =
            veri.isim;


        document.getElementById(
            "sonuc-fiyat"
        ).value =
            veri.fiyat
                .toFixed(2)
                .replace(".",",");


        document.getElementById(
            "sonuc-karti"
        ).style.display =
            "block";


        durum.innerText =
            "✅ Sonuç hazır. Kontrol edip ONAYLA'ya basın.";


    }

    catch(hata){

        console.error(
            "OCR HATASI:",
            hata
        );


        durum.innerText =
            "❌ Okuma hatası: " +
            hata.message;

    }

    finally{

        okumaDevamEdiyor =
            false;

        btn.disabled =
            false;

        btn.innerText =
            "🔍 ETİKETİ OKU";

    }

}


/* =========================================================
   ETİKET ÇÖZÜMLE
========================================================= */

function etiketiCozumle(metin){

    const satirlar =
        metin

            .split("\n")

            .map(
                s =>
                    s
                        .replace(/\s+/g," ")
                        .trim()
            )

            .filter(
                s =>
                    s.length > 0
            );


    console.log(
        "OCR SATIRLARI:",
        satirlar
    );


    /* ==========================================
       FİYAT
    ========================================== */

    let fiyat = 0;


    /* Önce TL / ₺ bulunan fiyat */

    const fiyatRegexleri = [

        /(\d{1,5}(?:[.,]\d{1,2})?)\s*(?:TL|Tl|tl)\b/gi,

        /(\d{1,5}(?:[.,]\d{1,2})?)\s*₺/gi,

        /₺\s*(\d{1,5}(?:[.,]\d{1,2})?)/gi

    ];


    for(
        const regex of fiyatRegexleri
    ){

        regex.lastIndex = 0;

        const eslesme =
            regex.exec(metin);


        if(eslesme){

            const deger =
                parseFloat(
                    eslesme[1]
                        .replace(",",".")
                );


            if(
                deger > 0 &&
                deger < 50000
            ){

                fiyat =
                    deger;

                break;

            }

        }

    }


    /* ==========================================
       FİYAT YEDEK SİSTEMİ
       
       ARTIK HER SAYI FİYAT DEĞİL.
    ========================================== */

    if(fiyat === 0){

        const adaylar = [];


        for(
            const satir of satirlar
        ){

            /* tarih */

            if(
                /\b\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b/.test(satir)
            ){

                continue;

            }


            /* barkod */

            if(
                /\b\d{8,14}\b/.test(satir)
            ){

                continue;

            }


            /* ölçü */

            if(
                /\b\d+(?:[.,]\d+)?\s*(?:KG|GR|G|ML|LT|L|CL)\b/i.test(satir)
            ){

                continue;

            }


            /* satırdaki sayıları bul */

            const sayilar =
                satir.match(
                    /\b\d{1,4}(?:[.,]\d{1,2})?\b/g
                );


            if(!sayilar){

                continue;

            }


            for(
                const sayi of sayilar
            ){

                const deger =
                    parseFloat(
                        sayi.replace(",",".")
                    );


                if(
                    deger >= 1 &&
                    deger < 10000
                ){

                    /*
                       Sadece 1-4 haneli
                       mantıklı fiyatları aday yap.
                    */

                    adaylar.push({

                        deger:deger,

                        uzunluk:sayi.length,

                        satir:satir

                    });

                }

            }

        }


        /*
           Yedek fiyat sistemi yalnızca
           TEK SAYI içeren kısa satırlara
           daha fazla güveniyor.
        */

        adaylar.sort(
            (a,b) => {

                const aPuan =
                    (a.uzunluk <= 5 ? 10 : 0) +
                    (/\b\d{1,3}[.,]\d{1,2}\b/.test(a.satir) ? 8 : 0);

                const bPuan =
                    (b.uzunluk <= 5 ? 10 : 0) +
                    (/\b\d{1,3}[.,]\d{1,2}\b/.test(b.satir) ? 8 : 0);

                return bPuan - aPuan;

            }
        );


        /*
           Çok düşük güvenli tek sayıyı
           otomatik fiyat yapmıyoruz.
        */

        if(
            adaylar.length === 1
        ){

            const aday =
                adaylar[0];


            if(
                aday.satir.trim() ===
                String(aday.satir.trim())
            ){

                /*
                   Tek başına sayı varsa
                   şimdilik fiyat kabul ediyoruz.
                   İlerleyen aşamada güven puanı
                   sistemi gelecek.
                */

                fiyat =
                    aday.deger;

            }

        }

    }


    /* ==========================================
       ÜRÜN ADI
    ========================================== */

    const yasakliKelime =
        /QR|KAREKOD|BARKOD|SKT|SON KULLANMA|TARİH|TARIH|ÜRETİM|URETIM|YERLİ|YERLI|MENŞE|MENSE|KDV|NET MİKTAR/i;


    const marketKelime =
        /^(BİM|BIM|A101|ŞOK|SOK|CARREFOUR|CARREFOURSA|FİLE|FILE|MARKET)$/i;


    const adaylar =
        [];


    for(
        const satir of satirlar
    ){

        if(
            yasakliKelime.test(satir)
        ){

            continue;

        }


        if(
            /(?:TL|₺)\b/i.test(satir)
        ){

            continue;

        }


        if(
            marketKelime.test(satir)
        ){

            continue;

        }


        /* barkod benzeri */

        if(
            /^\d[\d\s-]{6,}$/.test(satir)
        ){

            continue;

        }


        /* tarih */

        if(
            /\d{1,2}[./-]\d{1,2}[./-]\d{2,4}/.test(satir)
        ){

            continue;

        }


        const temiz =
            satir

                .replace(
                    /[^a-zA-ZçÇğĞıİöÖşŞüÜ0-9\s]/g,
                    ""
                )

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


        const harfSayisi =
            (
                temiz.match(
                    /[a-zA-ZçÇğĞıİöÖşŞüÜ]/g
                ) || []
            ).length;


        if(
            harfSayisi >= 3
        ){

            let puan =
                harfSayisi;


            /*
               Kelime sayısı fazla olan
               satırlar ürün adına daha uygun.
            */

            const kelimeSayisi =
                temiz.split(" ").length;


            puan +=
                kelimeSayisi * 3;


            adaylar.push({

                metin:temiz,

                puan:puan

            });

        }

    }


    adaylar.sort(
        (a,b) =>
            b.puan - a.puan
    );


    let isim =
        "OKUNAN ÜRÜN";


    if(
        adaylar.length > 0
    ){

        isim =
            adaylar[0]
                .metin
                .toUpperCase();

    }


    return{

        isim:isim,

        fiyat:fiyat,

        satirlar:satirlar

    };

}


/* =========================================================
   OCR SONUCUNU İPTAL ET
========================================================= */

function sonucuIptalEt(){

    bekleyenSonuc =
        null;


    document.getElementById(
        "sonuc-karti"
    ).style.display =
        "none";


    document.getElementById(
        "durum-etiket"
    ).innerText =
        "📷 Yeni etiketi çerçeveye getirin";

}


/* =========================================================
   OCR SONUCUNU ONAYLA
========================================================= */

function sonucuOnayla(){

    const isim =
        document.getElementById(
            "sonuc-urun"
        ).value.trim();


    const fiyatMetni =
        document.getElementById(
            "sonuc-fiyat"
        ).value

            .replace(",",".")
            .replace(/[^\d.]/g,"");


    const fiyat =
        parseFloat(fiyatMetni);


    if(
        !isim
    ){

        alert(
            "Ürün adını girin."
        );

        return;

    }


    if(
        !Number.isFinite(fiyat) ||
        fiyat <= 0
    ){

        alert(
            "Geçerli bir fiyat girin."
        );

        return;

    }


    sepeteEkle(
        isim.toUpperCase(),
        fiyat
    );


    bekleyenSonuc =
        null;


    document.getElementById(
        "sonuc-karti"
    ).style.display =
        "none";


    document.getElementById(
        "durum-etiket"
    ).innerText =
        "✅ Ürün sepete eklendi. Yeni etiketi okutabilirsiniz.";

}


/* =========================================================
   SEPETE EKLE
========================================================= */

function sepeteEkle(
    isim,
    fiyat
){

    const mevcut =
        sepet.find(
            u =>
                u.isim === isim &&
                Math.abs(
                    u.fiyat - fiyat
                ) < 0.001
        );


    if(mevcut){

        mevcut.adet += 1;

    }

    else{

        benzersizUrunId++;


        sepet.push({

            id:
                benzersizUrunId,

            isim:
                isim,

            fiyat:
                fiyat,

            adet:
                1

        });

    }


    tabloyuCiz();

}


/* =========================================================
   TABLO
========================================================= */

function tabloyuCiz(){

    const tbody =
        document.getElementById(
            "sepet-govdesi"
        );


    const tablo =
        document.getElementById(
            "kasa-tablosu"
        );


    const bos =
        document.getElementById(
            "bos-sepet-mesaji"
        );


    const genel =
        document.getElementById(
            "genel-toplam"
        );


    if(
        sepet.length === 0
    ){

        tablo.style.display =
            "none";

        bos.style.display =
            "block";

        genel.innerText =
            "0,00 TL";

        return;

    }


    tablo.style.display =
        "table";

    bos.style.display =
        "none";


    tbody.innerHTML =
        "";


    let genelToplam =
        0;


    sepet.forEach(
        urun => {

            const toplam =
                urun.fiyat *
                urun.adet;


            genelToplam +=
                toplam;


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td class="td-urun">
                    ${guvenliHTML(urun.isim)}
                </td>

                <td class="td-fiyat">
                    ${paraYaz(urun.fiyat)}
                </td>

                <td class="td-adet">

                    <div class="adet-kutusu">

                        <button
                            class="adet-btn"
                            onclick="adetDegistir(${urun.id},-1)">
                            −
                        </button>

                        <input
                            class="adet-input"
                            type="number"
                            min="1"
                            max="99999"
                            inputmode="numeric"
                            value="${urun.adet}"
                            onchange="klavyeAdet(event,${urun.id})">

                        <button
                            class="adet-btn"
                            onclick="adetDegistir(${urun.id},1)">
                            +
                        </button>

                    </div>

                </td>

                <td class="td-toplam">
                    ${paraYaz(toplam)}
                </td>

                <td>

                    <button
                        class="sil-btn"
                        onclick="satirSil(${urun.id})">
                        🗑️
                    </button>

                </td>

            `;


            tbody.appendChild(tr);

        }
    );


    genel.innerText =
        paraYaz(genelToplam);

}


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function guvenliHTML(metin){

    return String(metin)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   ADET
========================================================= */

function adetDegistir(
    id,
    fark
){

    const urun =
        sepet.find(
            u =>
                u.id === id
        );


    if(!urun){

        return;

    }


    urun.adet +=
        fark;


    if(
        urun.adet < 1
    ){

        urun.adet = 1;

    }


    tabloyuCiz();

}


/* =========================================================
   KLAVYE ADET
========================================================= */

function klavyeAdet(
    event,
    id
){

    const urun =
        sepet.find(
            u =>
                u.id === id
        );


    if(!urun){

        return;

    }


    let adet =
        parseInt(
            event.target.value
        );


    if(
        isNaN(adet) ||
        adet < 1
    ){

        adet = 1;

    }


    if(
        adet > 99999
    ){

        adet = 99999;

    }


    urun.adet =
        adet;


    tabloyuCiz();

}


/* =========================================================
   SATIR SİL
========================================================= */

function satirSil(id){

    sepet =
        sepet.filter(
            u =>
                u.id !== id
        );


    tabloyuCiz();

}


/* =========================================================
   PARA
========================================================= */

function paraYaz(sayi){

    return Number(sayi)

        .toLocaleString(
            "tr-TR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        )

        + " TL";

}

   SAYFA KAPANIRSA KAMERA KAPAT
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(akis){

            akis.getTracks().forEach(
                track =>
                    track.stop()
            );

        }

    }
);
