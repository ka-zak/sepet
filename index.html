<body>


<div class="uygulama-kapsayici">


    <div class="ust-banner-alani">

        <div class="logo">

<script>


/* ==========================================
   GENEL DEĞİŞKENLER
========================================== */

let akis = null;

let sepet = [];

let benzersizUrunId = 0;

let ocrMotoru = null;


/*
OCR aynı anda iki kez çalışmasın.
İKİNCİ ETİKET SORUNUNUN önemli çözümlerinden biri.
*/

let ocrCalisiyor = false;



/* ==========================================
   OCR MOTORUNU BAŞLAT
========================================== */

window.addEventListener("DOMContentLoaded", async function () {


    const bilgiKutusu =
        document.getElementById("bilgi-kutusu");


    try {


        bilgiKutusu.innerText =
            "⏳ OCR motoru hazırlanıyor...";


        /*
        Tesseract v5
        */

        ocrMotoru =
            await Tesseract.createWorker(
                "tur",
                1,
                {
                    logger: function(m) {

                        if (
                            m.status === "recognizing text"
                        ) {

                            bilgiKutusu.innerText =
                                "🔍 OCR çalışıyor...";

                        }

                    }
                }
            );


        /*
        OCR için daha uygun ayarlar
        */

        await ocrMotoru.setParameters({

            /*
            Tekdüze olmayan etiketler için
            otomatik sayfa düzeni.
            */

            tessedit_pageseg_mode: "6"

        });


        bilgiKutusu.innerText =
            "✅ Sistem Hazır! Kamerayı açabilirsiniz.";


        bilgiKutusu.style.background =
            "#e6f4ea";


        bilgiKutusu.style.color =
            "#137333";


    }

    catch (hata) {


        console.error(hata);


        bilgiKutusu.innerText =
            "❌ OCR Başlatma Hatası: " +
            hata.message;

    }


});



/* ==========================================
   KAMERA AÇ / KAPAT
========================================== */

async function kameraKontrol() {


    const video =
        document.getElementById("kamera-video");


    const kapsayici =
        document.getElementById("kamera-kapsayici");


    const btn =
        document.getElementById("btn-kamera");


    const durum =
        document.getElementById("durum-etiket");


    const cekBtn =
        document.getElementById("btn-cek");



    /* =====================
       KAMERA AÇ
    ===================== */

    if (!akis) {


        if (!ocrMotoru) {

            alert(
                "OCR henüz hazırlanıyor. Lütfen bekleyin."
            );

            return;

        }


        try {


            akis =
                await navigator.mediaDevices.getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        },

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        }

                    },

                    audio: false

                });


        }

        catch (hata1) {


            /*
            Bilgisayar kameralarında
            environment çalışmazsa
            normal kamera dene.
            */

            try {


                akis =
                    await navigator.mediaDevices.getUserMedia({

                        video: true,

                        audio: false

                    });


            }

            catch (hata2) {


                alert(
                    "Kameraya erişilemedi."
                );

                return;

            }

        }



        video.srcObject =
            akis;



        /*
        Video gerçekten hazır olmadan
        OCR çekim yapmasın.
        */

        await new Promise(function(resolve) {


            video.onloadedmetadata =
                function() {


                    video.play();

                    resolve();

                };


        });



        kapsayici.style.display =
            "block";


        btn.innerHTML =
            "🛑 Kamerayı Kapat";


        btn.classList.add("kapat");


        cekBtn.disabled =
            false;


        durum.innerText =
            "Etiketi kırmızı alanın içine yerleştirin";


    }


    /* =====================
       KAMERA KAPAT
    ===================== */

    else {


        if (ocrCalisiyor) {

            alert(
                "OCR işlemi devam ediyor. Lütfen bitmesini bekleyin."
            );

            return;

        }


        akis.getTracks().forEach(
            function(track) {

                track.stop();

            }
        );


        video.srcObject =
            null;


        akis =
            null;


        kapsayici.style.display =
            "none";


        btn.innerHTML =
            "📸 Kamerayı Aç";


        btn.classList.remove("kapat");


    }


}



/* ==========================================
   GÖRÜNTÜYÜ YAKALA
========================================== */

function kameradanGoruntuAl() {


    const video =
        document.getElementById("kamera-video");


    const canvas =
        document.createElement("canvas");


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    const videoGen =
        video.videoWidth;


    const videoYuk =
        video.videoHeight;



    /*
    Kameranın tamamını değil,
    kırmızı hedef alanına yakın
    merkezi bölgeyi alıyoruz.

    Bu, arka plandaki yüz, mobilya,
    duvar gibi şeylerin OCR'a karışmasını azaltır.
    */


    const x =
        Math.floor(videoGen * 0.05);


    const y =
        Math.floor(videoYuk * 0.10);


    const gen =
        Math.floor(videoGen * 0.90);


    const yuk =
        Math.floor(videoYuk * 0.75);



    /*
    Görüntüyü büyüt.

    Küçük yazılar OCR tarafından
    daha kolay okunur.
    */

    const buyutme =
        1.5;


    canvas.width =
        Math.floor(gen * buyutme);


    canvas.height =
        Math.floor(yuk * buyutme);



    ctx.drawImage(

        video,

        x,
        y,
        gen,
        yuk,

        0,
        0,

        canvas.width,
        canvas.height

    );



    /*
    Gri ton + kontrast işlemi
    */

    const imageData =
        ctx.getImageData(

            0,
            0,

            canvas.width,
            canvas.height

        );


    const data =
        imageData.data;



    for (

        let i = 0;

        i < data.length;

        i += 4

    ) {


        const gri =

            0.299 * data[i]

            +

            0.587 * data[i + 1]

            +

            0.114 * data[i + 2];



        /*
        Kontrast artır
        */

        let yeni =

            (gri - 128) * 1.45
            +
            128;



        if (yeni < 0) yeni = 0;

        if (yeni > 255) yeni = 255;



        data[i] =
            yeni;


        data[i + 1] =
            yeni;


        data[i + 2] =
            yeni;

    }



    ctx.putImageData(

        imageData,

        0,
        0

    );


    return canvas;

}



/* ==========================================
   ETİKETİ OKU
========================================== */

async function etiketiOkuVeEkle() {


    const video =
        document.getElementById("kamera-video");


    const durum =
        document.getElementById("durum-etiket");


    const cekBtn =
        document.getElementById("btn-cek");


    const ocrKutu =
        document.getElementById("ocr-kutu");


    const ocrMetin =
        document.getElementById("ocr-metin");



    if (!ocrMotoru) {

        durum.innerText =
            "OCR motoru henüz hazır değil.";

        return;

    }


    if (!akis) {

        durum.innerText =
            "Kamera açık değil.";

        return;

    }


    /*
    EN ÖNEMLİ KİLİT:

    OCR devam ederken
    ikinci OCR başlatma.
    */

    if (ocrCalisiyor) {

        return;

    }


    ocrCalisiyor =
        true;


    cekBtn.disabled =
        true;


    cekBtn.innerHTML =
        "⏳ Okunuyor...";


    durum.innerText =
        "📸 Görüntü alınıyor...";


    try {


        /*
        Video görüntüsünün hazır olduğundan emin ol.
        */

        if (

            video.readyState < 2

            ||

            video.videoWidth === 0

        ) {

            throw new Error(
                "Kamera görüntüsü henüz hazır değil."
            );

        }



        const canvas =
            kameradanGoruntuAl();



        durum.innerText =
            "🔍 Etiket OCR ile okunuyor...";



        /*
        OCR
        */

        const sonuc =
            await ocrMotoru.recognize(
                canvas
            );


        const hamMetin =
            sonuc.data.text || "";



        /*
        OCR metnini ekranda göster
        */

        ocrKutu.style.display =
            "block";


        ocrMetin.innerText =
            hamMetin;



        console.log(
            "OCR HAM METİN:",
            hamMetin
        );



        /*
        ETİKETİ ÇÖZ
        */

        const veri =
            etiketiCozumle(
                hamMetin
            );



        /* =========================
           FİYAT BULUNDU
        ========================= */

        if (

            veri.fiyat > 0

            &&

            veri.isim

            &&

            veri.isim !== "Tanımsız Ürün"

        ) {


            sepeteEkle(

                veri.isim,

                veri.fiyat

            );


            durum.innerText =

                "✅ Eklendi: "

                +

                veri.isim

                +

                " - "

                +

                paraFormatla(
                    veri.fiyat
                );


        }


        /* =========================
           FİYAT YOK
        ========================= */

        else {


            durum.innerText =
                "❌ TL veya ₺ işaretli fiyat bulunamadı.";


        }


    }

    catch (hata) {


        console.error(
            "OCR HATASI:",
            hata
        );


        durum.innerText =
            "❌ Hata: " +
            hata.message;


    }


    finally {


        /*
        ÇOK ÖNEMLİ:

        OCR bittikten sonra
        ikinci etiketi okuyabilmek için
        kilidi mutlaka açıyoruz.
        */

        ocrCalisiyor =
            false;


        cekBtn.disabled =
            false;


        cekBtn.innerHTML =
            "🔍 Bu Etiketi Oku";


    }


}



/* ==========================================
   ETİKET ÇÖZÜMLEME
========================================== */

function etiketiCozumle(hamMetin) {


    const satirlar =

        hamMetin

        .split("\n")

        .map(
            function(s) {

                return s.trim();

            }
        )

        .filter(
            function(s) {

                return s.length > 0;

            }
        );



    let fiyat =
        0;


    let fiyatSatiri =
        -1;



    /* ======================================
       SADECE PARA BİRİMLİ FİYAT

       19 TL
       19TL
       19 ₺
       19₺
       19,50 TL
       19.50 TL

       BAŞKA SAYIYI KABUL ETME
    ====================================== */


    const fiyatRegex =

        /(?:^|[^0-9])(\d{1,6}(?:[.,]\d{1,2})?)\s*(?:TL|₺)/i;



    for (

        let i = 0;

        i < satirlar.length;

        i++

    ) {


        const satir =
            satirlar[i];


        const eslesme =
            satir.match(
                fiyatRegex
            );



        if (eslesme) {


            const fiyatMetni =

                eslesme[1]

                .replace(",", ".");



            const bulunanFiyat =
                parseFloat(
                    fiyatMetni
                );



            if (

                !isNaN(
                    bulunanFiyat
                )

                &&

                bulunanFiyat > 0

                &&

                bulunanFiyat < 100000

            ) {


                fiyat =
                    bulunanFiyat;


                fiyatSatiri =
                    i;


                break;

            }

        }

    }



    /*
    Para birimi yoksa
    KESİNLİKLE fiyat yok.
    */

    if (fiyat <= 0) {


        return {

            isim:
                "Tanımsız Ürün",

            fiyat:
                0

        };

    }



    /* ======================================
       ÜRÜN ADI BULMA
    ====================================== */


    function yasakSatirMi(satir) {


        const buyuk =
            satir.toUpperCase();



        /*
        TL / ₺ bulunan satır
        ürün adı olmasın.
        */

        if (/(TL|₺)/i.test(satir)) {

            return true;

        }



        /*
        Barkod:
        Uzun sayı dizisi
        */

        if (/\d{7,}/.test(satir)) {

            return true;

        }



        /*
        Tarih
        */

        if (

            /\d{1,2}[./-]\d{1,2}[./-]\d{2,4}/.test(
                satir
            )

        ) {

            return true;

        }



        /*
        SKT / tarih kelimeleri
        */

        const yasaklar = [

            "SKT",

            "TETT",

            "STT",

            "SON KULLANMA",

            "SONKULLANMA",

            "ÜRETİM",

            "URETIM",

            "TARİH",

            "TARIH",

            "BARKOD",

            "BARCODE",

            "LOT",

            "PARTİ",

            "PARTI",

            "SERİ",

            "SERI",

            "NET MİKTAR",

            "NET MIKTAR",

            "GR",

            "KG",

            "ADET"

        ];



        for (const kelime of yasaklar) {


            if (
                buyuk.includes(kelime)
            ) {

                return true;

            }

        }



        /*
        Sadece sayı ve sembol
        */

        if (

            /^[\d\s.,:/-]+$/.test(
                satir
            )

        ) {

            return true;

        }



        /*
        Çok kısa
        */

        if (
            satir.length < 2
        ) {

            return true;

        }


        return false;

    }



    function urunPuani(satir) {


        if (
            yasakSatirMi(satir)
        ) {

            return -999;

        }



        const harfler =
            satir.match(
                /[A-Za-zÇĞİÖŞÜçğıöşü]/g
            );



        if (

            !harfler

            ||

            harfler.length < 2

        ) {

            return -999;

        }



        let puan =
            0;



        /*
        Harf sayısı
        */

        puan +=
            harfler.length;



        /*
        Fazla rakam varsa
        ürün olma ihtimali azalır.
        */

        const rakamlar =
            satir.match(/\d/g);



        if (rakamlar) {

            puan -=
                rakamlar.length * 5;

        }



        /*
        Çok uzun açıklamalar
        ürün adı olmayabilir.
        */

        if (
            satir.length > 60
        ) {

            puan -= 10;

        }


        return puan;

    }



    let enIyiIsim =
        "";



    let enIyiPuan =
        -999;



    /*
    Öncelik:
    Fiyat satırının üstündeki
    ürün isimleri
    */


    for (

        let i = 0;

        i < satirlar.length;

        i++

    ) {


        if (
            i === fiyatSatiri
        ) {

            continue;

        }



        const satir =
            satirlar[i];


        let puan =
            urunPuani(
                satir
            );



        if (
            puan <= -999
        ) {

            continue;

        }



        /*
        Fiyata yakın ürün adı
        daha değerli.
        */

        const uzaklik =
            Math.abs(
                i - fiyatSatiri
            );



        puan +=
            Math.max(
                0,
                20 - uzaklik * 3
            );



        if (

            puan > enIyiPuan

        ) {


            enIyiPuan =
                puan;


            enIyiIsim =
                satir;

        }

    }



    /*
    Ürün adını temizle
    */

    enIyiIsim =

        enIyiIsim

        .replace(
            /[^A-Za-zÇĞİÖŞÜçğıöşü0-9\s&()-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();



    if (

        !enIyiIsim

        ||

        enIyiIsim.length < 2

    ) {


        enIyiIsim =
            "Tanımsız Ürün";

    }



    return {

        isim:
            enIyiIsim,

        fiyat:
            fiyat

    };


}



/* ==========================================
   SEPETE EKLE
========================================== */

function sepeteEkle(isim, fiyat) {


    /*
    Aynı ürün zaten varsa
    otomatik adet artırma.

    Çünkü aynı etiketi yanlışlıkla
    tekrar okutmak istemiyoruz.
    */


    const mevcut =
        sepet.find(
            function(urun) {

                return (

                    urun.isim.toUpperCase()

                    ===

                    isim.toUpperCase()

                    &&

                    urun.fiyat === fiyat

                );

            }
        );



    if (mevcut) {

        return;

    }



    benzersizUrunId++;



    sepet.push({

        id:
            benzersizUrunId,

        isim:
            isim,

        fiyat:
            fiyat,

        adet:
            1

    });



    tabloyuCiz();

}



/* ==========================================
   TABLOYU ÇİZ
========================================== */

function tabloyuCiz() {


    const tbody =
        document.getElementById(
            "sepet-govdesi"
        );


    const tablo =
        document.getElementById(
            "kasa-tablosu"
        );


    const bosMesaj =
        document.getElementById(
            "bos-sepet-mesaji"
        );


    const genelToplamAlan =
        document.getElementById(
            "genel-toplam"
        );



    if (
        sepet.length === 0
    ) {


        tablo.style.display =
            "none";


        bosMesaj.style.display =
            "block";


        genelToplamAlan.innerText =
            "0,00 TL";


        return;

    }



    tablo.style.display =
        "table";


    bosMesaj.style.display =
        "none";


    tbody.innerHTML =
        "";



    let genelToplam =
        0;



    sepet.forEach(
        function(urun) {


            /*
            NULL / boş adet koruması
            */

            if (

                !urun.adet

                ||

                isNaN(urun.adet)

                ||

                urun.adet < 1

            ) {

                urun.adet = 1;

            }



            const satirToplam =

                urun.fiyat

                *

                urun.adet;



            genelToplam +=
                satirToplam;



            const tr =
                document.createElement("tr");



            tr.innerHTML = `

                <td class="td-urun">

                    ${htmlGuvenli(urun.isim)}

                </td>


                <td class="td-fiyat">

                    ${paraFormatla(urun.fiyat)}

                </td>


                <td class="td-adet">

                    <div class="adet-kutusu">

                        <button
                            class="adet-btn"
                            onclick="adetDegistir(${urun.id}, -1)"
                        >
                            −
                        </button>


                        <input
                            type="number"
                            class="adet-input"
                            value="${urun.adet}"
                            min="1"
                            inputmode="numeric"
                            onchange="klavyeAdet(event, ${urun.id})"
                        >


                        <button
                            class="adet-btn"
                            onclick="adetDegistir(${urun.id}, 1)"
                        >
                            +
                        </button>

                    </div>

                </td>


                <td class="td-toplam">

                    ${paraFormatla(satirToplam)}

                </td>


                <td class="td-sil">

                    <button
                        class="sil-btn"
                        onclick="satirSil(${urun.id})"
                    >
                        🗑️
                    </button>

                </td>

            `;



            tbody.appendChild(
                tr
            );


        }
    );



    genelToplamAlan.innerText =
        paraFormatla(
            genelToplam
        );


}



/* ==========================================
   ADET + -
========================================== */

function adetDegistir(id, miktar) {


    const urun =
        sepet.find(
            function(u) {

                return u.id === id;

            }
        );



    if (!urun) return;



    urun.adet +=
        miktar;



    if (
        urun.adet < 1
    ) {

        urun.adet = 1;

    }



    tabloyuCiz();

}



/* ==========================================
   KLAVYE İLE ADET
========================================== */

function klavyeAdet(event, id) {


    const urun =
        sepet.find(
            function(u) {

                return u.id === id;

            }
        );



    if (!urun) return;



    let yeniAdet =
        parseInt(
            event.target.value
        );



    if (

        isNaN(yeniAdet)

        ||

        yeniAdet < 1

    ) {

        yeniAdet = 1;

    }



    urun.adet =
        yeniAdet;



    tabloyuCiz();

}



/* ==========================================
   SATIR SİL
========================================== */

function satirSil(id) {


    sepet =
        sepet.filter(
            function(urun) {

                return urun.id !== id;

            }
        );



    tabloyuCiz();

}



/* ==========================================
   PARA FORMATLA
========================================== */

function paraFormatla(sayi) {


    return Number(sayi)

        .toLocaleString(

            "tr-TR",

            {

                minimumFractionDigits: 2,

                maximumFractionDigits: 2

            }

        )

        +

        " TL";

}



/* ==========================================
   HTML GÜVENLİ
========================================== */

function htmlGuvenli(metin) {


    const div =
        document.createElement("div");


    div.textContent =
        metin;


    return div.innerHTML;

}


</script>
